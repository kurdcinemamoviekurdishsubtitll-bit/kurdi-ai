<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurd-Ai</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            background-color: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 18px;
            background-color: #334155;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #475569;
            color: #38bdf8;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #475569;
            color: white;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #334155;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background-color: #1e293b;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        button {
            padding: 10px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Kurd-Ai</div>
    <div class="chat-messages" id="chatBox">
        <div class="message ai-message">سڵاو! بەخێر بێیت. ئامادەم بۆ وەڵامدانەوەی پرسیارەکانت بە زمانی کوردی سۆرانی.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="پەیامەکەت بنووسە..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ناردن</button>
    </div>
</div>

<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6Jdn_nsMSssBRAxD0CZ-GVCPT1Ko1R7xGUXibgFQd__qg";
    const TELEGRAM_BOT_TOKEN = "8763977900:AAEYu-yWIR7Oo5XHIpl8Z13hgLljv9z73_I";
    const TELEGRAM_CHAT_ID = "8469010473";

    async function sendToTelegram(userText, aiText) {
        if (!TELEGRAM_BOT_TOKEN) return;
        const msg = `📩 *چاتی نوێ لە وێبسایتەوە:*\n\n👤 *بەکارهێنەر:* ${userText}\n\n🤖 *وەڵامی ئەی ئای:* ${aiText}`;
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'Markdown' })
            });
        } catch (e) {
            console.error(e);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user-message');
        input.value = '';

        const loadingId = addMessage('پێشبینی وەڵام دەکرێت...', 'ai-message');

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "تەنها بە کوردیی سۆرانی و بە ڕێنووسی دروست وەڵامی ئەمە بده‌وە: " + text }] }]
                })
            });

            const data = await response.json();
            const reply = data.candidates[0].content.parts[0].text;
            document.getElementById(loadingId).innerText = reply;

            sendToTelegram(text, reply);
        } catch (error) {
            document.getElementById(loadingId).innerText = "کێشەیەک ڕوویدا لە پەیوەندیکردن بە ئەی ئایەکەوە.";
        }
    }

    function addMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msg = document.createElement('div');
        const id = 'msg-' + Date.now();
        msg.id = id;
        msg.className = `message ${className}`;
        msg.innerText = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function handleKeyPress(e) { 
        if (e.key === 'Enter') sendMessage(); 
    }
</script>

</body>
</html>
